name: whisper_chat
description: "A modern, premium Android user-to-user text chatting application built with Flutter and Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4

  # State Management
  provider: ^6.1.2

  # Security, Biometrics & Local Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1

  # UI & Animations
  flutter_staggered_animations: ^1.1.1
  emoji_picker_flutter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
